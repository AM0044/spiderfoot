# OpenSSF Scorecard for a PUBLIC repo.
#
# Uses the official Scorecard Action: runs the checks, publishes the result to
# the public scorecard.dev viewer, and powers the README badge. No personal
# access token needed — publishing uses a short-lived OIDC token.
#
# Actions are pinned to commit SHAs (version in the comment) so Dependabot can
# bump them safely.
name: OpenSSF Scorecard

on:
  branch_protection_rule:      # re-score when branch protection changes
  schedule:
    - cron: "0 7 * * 2"        # Tuesdays 07:00 UTC
  push:
    branches: [ master ]       # <-- your default branch (change if not master)

# Read-only at the workflow level (required by the publish API).
permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload results to Security > Code scanning
      id-token: write          # OIDC token that authenticates the published result
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true   # backs the badge + public viewer

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 90

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
